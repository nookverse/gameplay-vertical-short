name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: end-to-end render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and a font
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          else
            brew install ffmpeg-full
            echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          fi
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -E "^ *[^ ]+ +(drawtext|zscale|gradients|zoompan|minterpolate) " || true
      - run: python -m pip install -r requirements.txt
      - name: Compile tools
        run: python -m py_compile tools/*.py && bash -n tools/*.sh install.sh tests/smoke.sh
      - name: Smoke test
        run: tests/smoke.sh "$RUNNER_TEMP/gvs"
      - name: Install script
        run: ./install.sh --dir "$RUNNER_TEMP/skills" && ./install.sh --dir "$RUNNER_TEMP/skills" && ls "$RUNNER_TEMP/skills"
